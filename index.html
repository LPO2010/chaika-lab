<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Чайка · вход</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#183a30;font:17px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px}small{letter-spacing:3px;font-size:13px}h1{font:64px Georgia,serif;margin:15px 0}p{color:#53665a}label{display:block;margin:26px 0 8px}input,button{font:inherit;width:100%;padding:14px 16px;border-radius:5px}input{border:1px solid #a8b9a7;background:white}button{background:#183a30;color:white;border:0;cursor:pointer;margin-top:15px}button:disabled{opacity:.6}#status{min-height:28px;font-size:14px;color:#9b302c}.hint{font-size:14px}a{color:inherit}:focus-visible{outline:3px solid #87a72d;outline-offset:3px}</style><main><small>ТЕАТРАЛЬНАЯ ЛАБОРАТОРИЯ</small><h1>Чайка.</h1><p>Закрытый навигатор по лаборатории.<br>Введите пароль, чтобы открыть материалы.</p><form id="login"><label for="password">Пароль доступа</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit">Войти</button><div id="status" role="status" aria-live="polite"></div></form><p class="hint">Пароль не отправляется на сервер и не сохраняется. После обновления страницы потребуется войти снова.</p></main><script src="unlock.js"></script></html>
